# Daily wholesale price refresh.
#
# The project lives in the coleta/ subfolder of this repo, but GitHub only reads workflows
# from the repository root, so this file stays at .github/workflows/ and every step runs
# with working-directory: coleta. That also means the paths inside store.tar.gz are
# relative to coleta/ — tar and untar both happen there, so they stay consistent.
#
# The workbook carries BOTH halves of the panel: 32 produce generics from the Agrícolas
# module and 10 protein series from Pecuarios and Pesqueros. Those are separate collectors
# against separate SNIIM applications, so they fetch in separate steps and neither one's
# failure withholds the other's data. The publish gate reads the produce store, which is
# the primary series; proteins are reported but do not hold the release.
#
# Publishes coleta/precios_mayoreo_diario.xlsx as a release asset on the `data` tag, which
# gives a permanently stable download URL:
#
#   https://github.com/wilsonfelicio/marshall-workspace/releases/latest/download/precios_mayoreo_diario.xlsx
#
# The parquet store travels as a release asset rather than living in git:
# data/curated/cat_market_daily.parquet alone is 160MB, over GitHub's 100MB per-file limit,
# and committing a 3.8MB workbook daily would add ~1.4GB of history a year. Release assets
# are replaced, not versioned, so nothing accumulates.
#
# Timing: SNIIM states "Diaria (de lunes a viernes)" with no hour. Measured on 12 Aug 2026,
# the day was absent at 04:07 Mexico City and complete by 12:09, so this runs at 19:00 UTC
# = 13:00 Mexico City. GitHub delays cron under load, sometimes by an hour; that costs
# nothing because `run.py update` re-fetches a trailing 14-day window, so being late loses
# nothing and being early would.

name: precios diarios

on:
  schedule:
    - cron: "0 19 * * 1-5"      # 13:00 Mexico City, Mon-Fri
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run: build the store from scratch instead of restoring it"
        type: boolean
        default: false
      days:
        description: "Trailing window in days, to close a gap after an outage (blank = the configured 14)"
        type: number

permissions:
  contents: write               # required to replace the release assets

concurrency:
  group: precios-diarios        # the store takes an exclusive lock; never run two at once
  cancel-in-progress: false

defaults:
  run:
    working-directory: coleta

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coleta/requirements.txt

      - run: pip install -r requirements.txt

      # Six seconds of parser and nowcast tests, so a regression surfaces here rather
      # than forty minutes later as a mangled workbook. Deliberately blocking: verified
      # against this runner's own pandas/pyarrow before it was added.
      - name: Tests
        run: python -m pytest tests/ -q

      - name: Restore the store from the data release
        if: ${{ !inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data --pattern store.tar.gz --clobber
          tar xzf store.tar.gz
          rm store.tar.gz
          echo "restored:"; du -sh data/raw data/inpc 2>/dev/null || true
          wc -l data/manifest.csv
          wc -l data/manifest_proteinas.csv 2>/dev/null || echo "no protein manifest yet"

      - name: Bootstrap the store (first run only)
        if: ${{ inputs.bootstrap }}
        run: |
          python run.py catalog
          python run.py mapping --force
          python run.py backfill --start-year 2024 --workers 2

      # `update` exits non-zero if any single product came back failed or truncated. That
      # should not block the day: the trailing window refetches it tomorrow. The publish
      # decision belongs to check_freshness.py, which looks at the data instead.
      - name: Fetch the trailing window
        id: fetch
        run: |
          set +e
          python run.py update ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
          echo "update_rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Proteins were added to the workbook after the store already existed, so the first
      # run after this change finds no protein history and has to build it: about 350
      # month-jobs, half an hour, once. Gated on the manifest rather than on a dispatch
      # input, because a checkbox someone has to remember is a checkbox someone forgets,
      # and the cost of forgetting is a workbook whose protein columns quietly begin two
      # months ago instead of in 2024.
      - name: Seed the protein series if the store has none
        run: |
          # `[ -f x ] && n=...` would return non-zero when the file is absent, and the
          # default shell here is `bash -e`, so that one-liner fails the step on exactly
          # the run it exists to handle. Spell out the if.
          n=0
          if [ -f data/manifest_proteinas.csv ]; then
            n=$(grep -c ',ok,' data/manifest_proteinas.csv || true)
          fi
          if [ "$n" -lt 200 ]; then
            echo "::notice::protein store holds $n complete months — backfilling 2024 to date, about 30 minutes, once"
            python run_proteinas.py --from-year 2024 || \
              echo "::warning::the protein backfill reported failures; it resumes on the next run"
          else
            echo "protein store OK: $n complete months already fetched"
          fi

      # A month is this collector's unit of work, so its resume rule would mark the current
      # month done on the first fetch and never look at it again — the panel would freeze on
      # the day of the first run while still reporting success. --update ignores the manifest
      # for this month and last. Non-blocking for the same reason as `run.py update`:
      # res_cortes still paginates and cerdo_cortes returns nothing, both known, both
      # recorded in the manifest, and neither a reason to withhold the produce panel.
      - name: Fetch the protein window
        id: proteins
        run: |
          set +e
          python run_proteinas.py --update
          echo "prot_rc=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Verify the store
        run: python run.py verify || echo "::warning::run.py verify reported problems"

      - name: Publish gate
        run: python scripts/check_freshness.py

      - name: Build the workbook
        run: |
          python export_panel_xlsx.py
          ls -la precios_mayoreo_diario.xlsx

      - name: Pack the store
        run: |
          # The protein manifest is listed only if it exists. tar exits non-zero on a
          # missing operand, which would fail this step and withhold the produce workbook
          # too — the one outcome the split-collector design exists to prevent. Spelled as
          # an if for the same reason as the seed step: `[ -f x ] && v=...` returns
          # non-zero under `bash -e` on exactly the run it is meant to handle.
          extra=""
          if [ -f data/manifest_proteinas.csv ]; then
            extra="data/manifest_proteinas.csv"
          fi
          # Same for data/inpc: it comes from inpc_run.py, which the bootstrap path never
          # runs, so on 18 Sep 2026 a 2.6-hour bootstrap died here with nothing published.
          if [ -d data/inpc ]; then
            extra="$extra data/inpc"
          fi
          tar czf store.tar.gz data/raw data/catalog data/manifest.csv \
            $extra data/curated/.last_rows.json

      # The release holds one copy and --clobber deletes it before uploading the next, so
      # the day's store and workbook are set aside first, on every run. Thirty days of
      # them also means a bad data day can be rolled back, not only a failed upload. To
      # restore, download the artifact and run
      # `gh release upload data precios_mayoreo_diario.xlsx store.tar.gz --clobber`.
      # Paths are from the repository root; `working-directory` does not apply to `uses`.
      - name: Back up the store and workbook
        continue-on-error: true     # a failed backup must not withhold the day's data
        uses: actions/upload-artifact@v4
        with:
          name: store-backup
          path: |
            coleta/store.tar.gz
            coleta/precios_mayoreo_diario.xlsx
          retention-days: 30
          compression-level: 0      # both files are already compressed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Latest data" --notes "Rolling data release. Assets are replaced on each run."
          # --clobber deletes each old asset before uploading its replacement, so a failed
          # upload leaves the release with no store at all, and the store lives nowhere
          # else. On 17 Sep 2026 one HTTP 500 from the GitHub API did exactly that and cost
          # a full re-bootstrap. Retrying is safe: a re-run simply uploads what is missing.
          ok=""
          for attempt in 1 2 3 4 5; do
            if gh release upload data precios_mayoreo_diario.xlsx store.tar.gz --clobber; then
              ok=1
              break
            fi
            echo "::warning::release upload failed (attempt $attempt of 5)"
            sleep $((attempt * 30))
          done
          if [ -z "$ok" ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### precios_mayoreo_diario.xlsx"
            echo
            echo "- produce update exit code: \`${{ steps.fetch.outputs.update_rc }}\` (non-zero only means some products need a retry)"
            echo "- protein update exit code: \`${{ steps.proteins.outputs.prot_rc }}\`"
            echo "- newest produce quote day: \`$(python -c "import pandas as pd; print(pd.read_parquet('data/curated/var_market_daily.parquet', columns=['fecha']).fecha.max())" 2>/dev/null || echo unknown)\`"
            echo "- newest protein quote day: \`$(python -c "import glob, pandas as pd; f=glob.glob('data/raw/proteinas/*/anio=*/part.parquet'); print(max(pd.read_parquet(x, columns=['fecha']).fecha.max() for x in f) if f else 'none')" 2>/dev/null || echo unknown)\`"
            echo
            echo "[Download the workbook](https://github.com/${{ github.repository }}/releases/latest/download/precios_mayoreo_diario.xlsx)"
          } >> "$GITHUB_STEP_SUMMARY"
