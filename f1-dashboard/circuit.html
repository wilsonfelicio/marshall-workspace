<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Silverstone — Circuit Diagram</title>
<style>
:root { --bg:#0a0a0a; --surface:#141414; --border:#2a2a2a; --text:#e0e0e0; --muted:#888; --accent:#DC0000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; padding:16px; }
.header { text-align:center; margin-bottom:16px; }
.header h1 { font-size:1.4rem; font-weight:700; }
.header .flag { font-size:2rem; }
.header .meta { color:var(--muted); font-size:0.8rem; margin-top:4px; }
.wrap { max-width:900px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
.diagram { width:100%; height:auto; display:block; }
.legend { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:14px; font-size:0.8rem; }
.legend div { display:flex; align-items:center; gap:6px; color:var(--muted); }
.swatch { width:22px; height:0; border-top-width:3px; border-top-style:solid; }
.dot { width:12px; height:12px; border-radius:50%; }
.back { display:inline-block; margin-top:14px; color:#f59e0b; font-size:0.8rem; text-decoration:none; }
.corner-label { fill:#e0e0e0; font-size:13px; font-weight:600; font-family:-apple-system,sans-serif; }
.speed-label { fill:#f59e0b; font-size:11px; font-family:-apple-system,sans-serif; }
.zone-label { fill:#4ade80; font-size:11px; font-weight:600; font-family:-apple-system,sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<div class="header">
    <div class="flag">🇬🇧</div>
    <h1>Silverstone Circuit</h1>
    <div class="meta">5.891 km · 18 turns · 52 laps · 2 DRS zones · Clockwise</div>
</div>

<div class="card">
<svg class="diagram" viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Track outline (stylized) -->
    <path d="M 175 415
             C 150 360 165 300 220 285
             C 275 270 300 300 335 275
             C 372 248 405 258 450 235
             C 510 208 575 213 625 248
             C 690 292 715 345 700 395
             C 688 435 650 458 605 458
             C 552 458 530 428 485 440
             C 435 453 415 495 360 498
             C 300 501 285 468 250 478
             C 210 490 190 468 200 430
             C 205 405 195 400 175 415 Z"
          fill="none" stroke="#3a3a3a" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 175 415
             C 150 360 165 300 220 285
             C 275 270 300 300 335 275
             C 372 248 405 258 450 235
             C 510 208 575 213 625 248
             C 690 292 715 345 700 395
             C 688 435 650 458 605 458
             C 552 458 530 428 485 440
             C 435 453 415 495 360 498
             C 300 501 285 468 250 478
             C 210 490 190 468 200 430
             C 205 405 195 400 175 415 Z"
          fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linejoin="round"/>

    <!-- DRS zone 1: Wellington Straight (bottom, into Brooklands) -->
    <line x1="360" y1="498" x2="250" y2="478" stroke="#4ade80" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text class="zone-label" x="300" y="527" text-anchor="middle">DRS · Wellington Str.</text>

    <!-- DRS zone 2: Hangar Straight (right side, into Stowe) -->
    <line x1="702" y1="345" x2="702" y2="405" stroke="#4ade80" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text class="zone-label" x="724" y="372" text-anchor="start">DRS</text>
    <text class="zone-label" x="724" y="386" text-anchor="start">Hangar</text>

    <!-- Start/finish line -->
    <line x1="166" y1="428" x2="190" y2="404" stroke="#fff" stroke-width="6"/>
    <text class="corner-label" x="118" y="414" text-anchor="middle" style="fill:#DC0000;">START /</text>
    <text class="corner-label" x="118" y="431" text-anchor="middle" style="fill:#DC0000;">FINISH</text>

    <!-- Overtake zones (orange dots) -->
    <circle cx="255" cy="479" r="7" fill="#f59e0b"/>
    <circle cx="700" cy="403" r="7" fill="#f59e0b"/>
    <circle cx="487" cy="440" r="7" fill="#f59e0b"/>

    <!-- Corner labels + speeds -->
    <text class="corner-label" x="205" y="463" text-anchor="end">Abbey (T1)</text>
    <text class="speed-label"  x="205" y="477" text-anchor="end">~290 km/h</text>

    <text class="corner-label" x="360" y="533" text-anchor="middle">Village / Loop (T3-4)</text>
    <text class="speed-label"  x="360" y="547" text-anchor="middle">~90 km/h · slowest</text>

    <text class="corner-label" x="232" y="503" text-anchor="end">Brooklands (T6)</text>

    <text class="corner-label" x="145" y="298" text-anchor="start">Luffield /</text>
    <text class="corner-label" x="145" y="314" text-anchor="start">Woodcote (T7-8)</text>

    <text class="corner-label" x="300" y="258" text-anchor="middle">Copse (T9)</text>
    <text class="speed-label"  x="300" y="272" text-anchor="middle">~290 km/h</text>

    <text class="corner-label" x="470" y="216" text-anchor="middle">Maggotts-Becketts-Chapel</text>
    <text class="speed-label"  x="470" y="230" text-anchor="middle">~280 km/h esses (T10-14)</text>

    <text class="corner-label" x="648" y="252" text-anchor="start">Hangar Str.</text>

    <text class="corner-label" x="658" y="452" text-anchor="start">Stowe (T15)</text>
    <text class="speed-label"  x="658" y="466" text-anchor="start">~250 km/h</text>

    <text class="corner-label" x="487" y="422" text-anchor="middle">Vale / Club (T16-18)</text>
    <text class="speed-label"  x="487" y="478" text-anchor="middle">~130 km/h</text>

    <!-- Direction arrow -->
    <g transform="translate(255,315)">
        <path d="M 0 0 L 26 0 M 18 -6 L 26 0 L 18 6" stroke="#888" stroke-width="2" fill="none"/>
        <text x="-4" y="4" text-anchor="end" style="fill:#888;font-size:11px;font-family:-apple-system,sans-serif;">lap direction</text>
    </g>
</svg>

<div class="legend">
    <div><span class="swatch" style="border-top-color:#e0e0e0;"></span> Track</div>
    <div><span class="swatch" style="border-top-color:#4ade80; border-top-style:dashed;"></span> DRS zone</div>
    <div><span class="dot" style="background:#f59e0b;"></span> Overtake spot</div>
    <div><span class="swatch" style="border-top-color:#fff;"></span> Start / finish</div>
</div>
</div>

<a class="back" href="index.html">← Back to dashboard</a>
</div>
</body>
</html>
