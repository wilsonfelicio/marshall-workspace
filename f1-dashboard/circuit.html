<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Spa-Francorchamps — Circuit Diagram</title>
<style>
:root { --bg:#0a0a0a; --surface:#141414; --border:#2a2a2a; --text:#e0e0e0; --muted:#888; --accent:#DC0000; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; padding:16px; }
.header { text-align:center; margin-bottom:16px; }
.header h1 { font-size:1.4rem; font-weight:700; }
.header .flag { font-size:2rem; }
.header .meta { color:var(--muted); font-size:0.8rem; margin-top:4px; }
.wrap { max-width:900px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
.diagram { width:100%; height:auto; display:block; }
.legend { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:14px; font-size:0.8rem; }
.legend div { display:flex; align-items:center; gap:6px; color:var(--muted); }
.swatch { width:22px; height:0; border-top-width:3px; border-top-style:solid; }
.dot { width:12px; height:12px; border-radius:50%; }
.back { display:inline-block; margin-top:14px; color:#f59e0b; font-size:0.8rem; text-decoration:none; }
.corner-label { fill:#e0e0e0; font-size:13px; font-weight:600; font-family:-apple-system,sans-serif; }
.speed-label { fill:#f59e0b; font-size:11px; font-family:-apple-system,sans-serif; }
.zone-label { fill:#4ade80; font-size:11px; font-weight:600; font-family:-apple-system,sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<div class="header">
    <div class="flag">🇧🇪</div>
    <h1>Circuit de Spa-Francorchamps</h1>
    <div class="meta">7.004 km · 19 turns · 44 laps · 2 DRS zones · Clockwise</div>
</div>

<div class="card">
<svg class="diagram" viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Track outline (stylized) -->
    <path d="M 175 480
             C 152 468 128 456 138 432
             C 146 414 172 418 186 440
             C 202 468 208 512 238 526
             C 258 535 274 520 292 504
             C 380 424 460 342 548 262
             C 568 244 592 232 616 242
             C 664 260 702 282 712 328
             C 720 362 706 386 680 402
             C 658 416 648 444 618 472
             C 584 505 544 524 494 524
             C 398 524 330 516 268 506
             C 234 500 210 502 190 486
             C 183 481 178 481 175 480 Z"
          fill="none" stroke="#3a3a3a" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 175 480
             C 152 468 128 456 138 432
             C 146 414 172 418 186 440
             C 202 468 208 512 238 526
             C 258 535 274 520 292 504
             C 380 424 460 342 548 262
             C 568 244 592 232 616 242
             C 664 260 702 282 712 328
             C 720 362 706 386 680 402
             C 658 416 648 444 618 472
             C 584 505 544 524 494 524
             C 398 524 330 516 268 506
             C 234 500 210 502 190 486
             C 183 481 178 481 175 480 Z"
          fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linejoin="round"/>

    <!-- DRS zone 1: Kemmel Straight (after Eau Rouge, into Les Combes) -->
    <line x1="315" y1="486" x2="540" y2="270" stroke="#4ade80" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text class="zone-label" x="392" y="404" text-anchor="start" transform="rotate(-41 392 404)">DRS · Kemmel Straight</text>

    <!-- DRS zone 2: start/finish straight (into La Source) -->
    <line x1="258" y1="504" x2="200" y2="494" stroke="#4ade80" stroke-width="5" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text class="zone-label" x="230" y="540" text-anchor="middle">DRS · Start/Finish</text>

    <!-- Start/finish line -->
    <line x1="162" y1="470" x2="188" y2="478" stroke="#fff" stroke-width="6"/>
    <text class="corner-label" x="150" y="455" text-anchor="middle" style="fill:#DC0000;">START /</text>
    <text class="corner-label" x="150" y="471" text-anchor="middle" style="fill:#DC0000;">FINISH</text>

    <!-- Overtake zones (orange dots) -->
    <circle cx="582" cy="248" r="7" fill="#f59e0b"/>
    <circle cx="160" cy="440" r="7" fill="#f59e0b"/>
    <circle cx="252" cy="503" r="7" fill="#f59e0b"/>

    <!-- Corner labels + speeds -->
    <text class="corner-label" x="118" y="420" text-anchor="end">La Source (T1)</text>
    <text class="speed-label"  x="118" y="434" text-anchor="end">~65 km/h · hairpin</text>

    <text class="corner-label" x="250" y="556" text-anchor="middle">Eau Rouge / Raidillon (T3-4)</text>
    <text class="speed-label"  x="250" y="570" text-anchor="middle">~300 km/h · flat-out</text>

    <text class="corner-label" x="628" y="228" text-anchor="middle">Les Combes (T5)</text>
    <text class="speed-label"  x="628" y="242" text-anchor="middle">~130 km/h</text>

    <text class="corner-label" x="726" y="322" text-anchor="start">Rivage (T7)</text>
    <text class="speed-label"  x="726" y="336" text-anchor="start">~85 km/h</text>

    <text class="corner-label" x="700" y="418" text-anchor="start">Pouhon (T10-11)</text>
    <text class="speed-label"  x="700" y="432" text-anchor="start">~285 km/h</text>

    <text class="corner-label" x="520" y="546" text-anchor="middle">Stavelot (T15)</text>
    <text class="speed-label"  x="520" y="560" text-anchor="middle">~155 km/h</text>

    <text class="corner-label" x="360" y="536" text-anchor="middle">Blanchimont (T18)</text>
    <text class="speed-label"  x="360" y="550" text-anchor="middle">~310 km/h · flat</text>

    <text class="corner-label" x="205" y="484" text-anchor="end">Bus Stop (T19)</text>
    <text class="speed-label"  x="205" y="498" text-anchor="end">~80 km/h · chicane</text>

    <!-- Direction arrow -->
    <g transform="translate(300,430)">
        <path d="M 0 0 L 24 -20 M 14 -22 L 24 -20 L 22 -10" stroke="#888" stroke-width="2" fill="none"/>
        <text x="-4" y="4" text-anchor="end" style="fill:#888;font-size:11px;font-family:-apple-system,sans-serif;">lap direction</text>
    </g>
</svg>

<div class="legend">
    <div><span class="swatch" style="border-top-color:#e0e0e0;"></span> Track</div>
    <div><span class="swatch" style="border-top-color:#4ade80; border-top-style:dashed;"></span> DRS zone</div>
    <div><span class="dot" style="background:#f59e0b;"></span> Overtake spot</div>
    <div><span class="swatch" style="border-top-color:#fff;"></span> Start / finish</div>
</div>
</div>

<a class="back" href="index.html">← Back to dashboard</a>
</div>
</body>
</html>
